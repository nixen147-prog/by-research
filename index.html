<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>By-Research | Digital Architect Dashboard</title>
    <style>
        :root {
            --neon-cyan: #00ffcc;
            --neon-pink: #ff3366;
            --bg-black: #050505;
            --sidebar-width: 300px;
            --glass-bg: rgba(0, 255, 204, 0.05);
            --border-color: rgba(0, 255, 204, 0.2);
        }

        body { 
            margin: 0; 
            background: var(--bg-black); 
            color: var(--neon-cyan); 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        #sidebar-header h1 {
            font-size: 18px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .nav-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 255, 204, 0.05);
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .nav-item:hover {
            background: var(--glass-bg);
            padding-left: 30px;
        }

        .nav-item.active {
            background: rgba(0, 255, 204, 0.1);
            border-left: 4px solid var(--neon-cyan);
            color: #fff;
        }

        #metadata-panel {
            flex-grow: 1;
            padding: 20px;
            font-size: 11px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.4);
        }

        .metadata-section {
            margin-bottom: 20px;
        }

        .metadata-label {
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .metadata-value {
            color: var(--neon-cyan);
            display: block;
            margin-bottom: 10px;
        }

        .metadata-pink {
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        #main-container {
            flex-grow: 1;
            position: relative;
        }

        #ui-overlay { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none;
            box-sizing: border-box;
        }

        #top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .toggle-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 8px 15px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        #layer-control {
            position: absolute;
            bottom: 60px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            min-width: 180px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            cursor: pointer;
            color: #888;
            transition: color 0.3s;
        }

        .layer-item.active {
            color: var(--neon-cyan);
        }

        .layer-checkbox {
            width: 12px;
            height: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .layer-item.active .layer-checkbox {
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .layer-item.active.pink .layer-checkbox {
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        #status-bar { 
            position: absolute; 
            bottom: 20px; left: 20px; 
            font-size: 11px; 
            background: rgba(0, 255, 204, 0.1); 
            padding: 5px 15px; 
            border-left: 3px solid var(--neon-cyan);
            display: flex;
            gap: 20px;
            min-width: 400px;
        }

        #scanner-text {
            color: var(--neon-pink);
        }

        #controls-hint { 
            position: absolute; 
            bottom: 20px; right: 20px; 
            color: #444; font-size: 10px; 
        }

        canvas { display: block; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-header">
            <h1>By-Research</h1>
            <div style="font-size: 9px; color: #666; margin-top: 5px;">TACTICAL_SUITE_v7.0</div>
        </div>
        
        <div id="nav-list">
            <div class="nav-item active" onclick="switchSubject('helsingor')">Helsingør Station</div>
            <div class="nav-item" onclick="switchSubject('ejby')">Ejbybunkeren</div>
            <div class="nav-item" onclick="switchSubject('hadsundvej12l')">Hadsundvej 12L</div>
        </div>

        <div id="metadata-panel">
            <div id="metadata-content"></div>
        </div>
    </div>

    <div id="main-container">
        <div id="ui-overlay">
            <div id="top-bar">
                <button id="xray-toggle" class="toggle-btn" onclick="toggleXray()">X-Ray Mode: OFF</button>
            </div>

            <div id="status-bar">
                <span>SYSTEM_READY</span>
                <span>SOURCE: <span id="source-id">HELSINGØR</span></span>
                <span>SCANNER: [<span id="scanner-text">F3:A1:09:88</span>]</span>
            </div>

            <div id="layer-control">
                <div class="layer-item active" onclick="toggleLayer('architecture', this)">
                    <div class="layer-checkbox"></div> Architecture
                </div>
                <div class="layer-item pink active" onclick="toggleLayer('substructure', this)">
                    <div class="layer-checkbox"></div> Sub-Structure
                </div>
                <div class="layer-item pink active" onclick="toggleLayer('hazard', this)">
                    <div class="layer-checkbox"></div> Hazard Analysis
                </div>
                <div class="layer-item active" onclick="toggleLayer('safety', this)">
                    <div class="layer-checkbox"></div> Safety & Compliance
                </div>
                <div class="layer-item active" onclick="toggleLayer('energy', this)">
                    <div class="layer-checkbox"></div> Energy & Logistics
                </div>
            </div>

            <div id="controls-hint">ROT: L_MOUSE | ZOOM: SCROLL | PAN: R_MOUSE</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let helsingorGroup, ejbyGroup, hadsundvejGroup;
        let currentSubject = 'helsingor';
        let xrayEnabled = false;

        const layers = {
            architecture: true,
            substructure: true,
            hazard: true,
            safety: true,
            energy: true
        };

        const subjects = {
            helsingor: {
                id: 'HELSINGØR_STATION',
                title: 'Helsingør Station',
                metadata: {
                    by: 'Helsingør',
                    aarstal: '1891',
                    arkitekt: 'Holsøe & Wenck',
                    fundament: '1.600 træpæle',
                    tracks: '5 Tracks',
                    special: 'ROYAL_WAITING_ROOM'
                }
            },
            ejby: {
                id: 'EJBYBUNKEREN',
                title: 'Ejbybunkeren',
                metadata: {
                    by: 'Rødovre',
                    periode: '1952-1954',
                    type: 'Cold War Command',
                    dybde: '-12.0m',
                    air: 'Gas-Safe HEPA',
                    special: 'RADIATION_SHIELD'
                }
            },
            hadsundvej12l: {
                id: 'HADSUNDVEJ_12L',
                title: 'Hadsundvej 12L',
                metadata: {
                    tenant: 'Flytte Møller',
                    fire_class: 'EI60',
                    area: '3.427 m²',
                    pollution: 'V2 Kortlagt',
                    special: 'LOGISTICS_HUB'
                }
            }
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 300) / window.innerHeight, 0.1, 1000);
            camera.position.set(20, 15, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth - 300, window.innerHeight);
            document.getElementById('main-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const grid = new THREE.GridHelper(50, 50, 0x111111, 0x222222);
            scene.add(grid);

            helsingorGroup = buildHelsingor();
            ejbyGroup = buildEjby();
            hadsundvejGroup = buildHadsundvej();

            scene.add(helsingorGroup);
            scene.add(ejbyGroup);
            scene.add(hadsundvejGroup);

            switchSubject('helsingor');
            window.addEventListener('resize', onWindowResize);
        }

        function createLayerGroup(name) {
            const group = new THREE.Group();
            group.name = name;
            return group;
        }

        function buildHelsingor() {
            const group = new THREE.Group();
            const arch = createLayerGroup('architecture');
            const sub = createLayerGroup('substructure');
            const energy = createLayerGroup('energy');

            const cyanMat = new THREE.LineBasicMaterial({ color: 0x00ffcc });
            const pinkMat = new THREE.LineBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.3 });

            // Main Building
            const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(10, 5, 16)), cyanMat);
            arch.add(box);

            // Towers
            for (let x of [-4, 4]) {
                for (let z of [-7, 7]) {
                    const tower = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2, 8, 2)), cyanMat);
                    tower.position.set(x, 1.5, z);
                    arch.add(tower);
                }
            }

            // Piles
            const pileGeom = new THREE.EdgesGeometry(new THREE.BoxGeometry(0.2, 8, 0.2));
            for (let x = -4; x <= 4; x += 2) {
                for (let z = -7; z <= 7; z += 2) {
                    const pile = new THREE.LineSegments(pileGeom, pinkMat);
                    pile.position.set(x, -5, z);
                    sub.add(pile);
                }
            }

            group.add(arch, sub, createLayerGroup('hazard'), createLayerGroup('safety'), energy);
            return group;
        }

        function buildEjby() {
            const group = new THREE.Group();
            const arch = createLayerGroup('architecture');
            const sub = createLayerGroup('substructure');

            const cyanMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.2 });
            const pinkMat = new THREE.LineBasicMaterial({ color: 0xff3366 });

            // Volden
            const vold = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(20, 2, 25)), cyanMat);
            arch.add(vold);

            // Bunker Levels
            const l1 = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(10, 3, 15)), pinkMat);
            l1.position.y = -4;
            sub.add(l1);

            const l2 = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(12, 3, 18)), pinkMat);
            l2.position.y = -8;
            sub.add(l2);

            group.add(arch, sub, createLayerGroup('hazard'), createLayerGroup('safety'), createLayerGroup('energy'));
            return group;
        }

        function buildHadsundvej() {
            const group = new THREE.Group();
            const arch = createLayerGroup('architecture');
            const sub = createLayerGroup('substructure');
            const hazard = createLayerGroup('hazard');
            const energy = createLayerGroup('energy');

            const cyanMat = new THREE.LineBasicMaterial({ color: 0x00ffcc });
            const pinkMat = new THREE.LineBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.4 });

            // Main Hall
            const main = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(20, 5, 15)), cyanMat);
            arch.add(main);

            // Basement
            const basement = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(10, 3, 12)), pinkMat);
            basement.position.set(-4, -4, 0);
            sub.add(basement);

            // Hazard Zone
            const haz = new THREE.Mesh(new THREE.BoxGeometry(15, 0.1, 15), new THREE.MeshBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.2 }));
            haz.position.y = -2.5;
            haz.name = "hazard_pulse";
            hazard.add(haz);

            // Truck
            const truck = new THREE.Group();
            truck.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2, 2, 6)), cyanMat));
            truck.position.set(-12, -1.5, 5);
            energy.add(truck);

            group.add(arch, sub, hazard, createLayerGroup('safety'), energy);
            return group;
        }

        window.switchSubject = (id) => {
            currentSubject = id;
            helsingorGroup.visible = (id === 'helsingor');
            ejbyGroup.visible = (id === 'ejby');
            hadsundvejGroup.visible = (id === 'hadsundvej12l');
            
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.getAttribute('onclick').includes(id));
            });
            
            document.getElementById('source-id').innerText = subjects[id].id;
            updateMetadata();
            updateLayerVisibility();
        };

        function updateMetadata() {
            const data = subjects[currentSubject];
            let html = `<div class="metadata-section"><span class="metadata-label">TITLE</span><span class="metadata-value">${data.title}</span></div>`;
            for (const [k, v] of Object.entries(data.metadata)) {
                html += `<div class="metadata-section"><span class="metadata-label">${k.toUpperCase()}</span><span class="metadata-value ${k==='special'?'metadata-pink':''}">${v}</span></div>`;
            }
            document.getElementById('metadata-content').innerHTML = html;
        }

        window.toggleLayer = (layer, el) => {
            layers[layer] = !layers[layer];
            el.classList.toggle('active');
            updateLayerVisibility();
        };

        window.toggleXray = () => {
            xrayEnabled = !xrayEnabled;
            const btn = document.getElementById('xray-toggle');
            btn.innerText = `X-Ray Mode: ${xrayEnabled ? 'ON' : 'OFF'}`;
            btn.classList.toggle('active');
            
            Object.keys(layers).forEach(k => {
                if (k !== 'architecture') {
                    layers[k] = xrayEnabled;
                    document.querySelector(`[onclick*="'${k}'"]`).classList.toggle('active', xrayEnabled);
                }
            });
            updateLayerVisibility();
        };

        function updateLayerVisibility() {
            [helsingorGroup, ejbyGroup, hadsundvejGroup].forEach(g => {
                g.children.forEach(l => {
                    if (layers[l.name] !== undefined) l.visible = layers[l.name];
                });
            });
        }

        function onWindowResize() {
            camera.aspect = (window.innerWidth - 300) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 300, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            const time = Date.now() * 0.001;

            if (helsingorGroup.visible) helsingorGroup.rotation.y += 0.001;
            if (ejbyGroup.visible) ejbyGroup.rotation.y += 0.001;
            if (hadsundvejGroup.visible) {
                hadsundvejGroup.rotation.y += 0.001;
                const hp = hadsundvejGroup.getObjectByName('hazard_pulse');
                if (hp) hp.material.opacity = 0.1 + Math.sin(time * 3) * 0.1;
            }

            if (Math.random() > 0.9) {
                document.getElementById('scanner-text').innerText = Math.random().toString(16).substr(2, 8).toUpperCase().match(/.{2}/g).join(':');
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
