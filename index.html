<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>By-Research | Digital Architect Dashboard</title>
    <style>
        :root {
            --neon-cyan: #00ffcc;
            --neon-pink: #ff3366;
            --bg-black: #050505;
            --sidebar-width: 300px;
            --glass-bg: rgba(0, 255, 204, 0.05);
            --border-color: rgba(0, 255, 204, 0.2);
        }

        body { 
            margin: 0; 
            background: var(--bg-black); 
            color: var(--neon-cyan); 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        #sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        #sidebar-header h1 {
            font-size: 18px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .nav-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 255, 204, 0.05);
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .nav-item:hover {
            background: var(--glass-bg);
            padding-left: 30px;
        }

        .nav-item.active {
            background: rgba(0, 255, 204, 0.1);
            border-left: 4px solid var(--neon-cyan);
            color: #fff;
        }

        #metadata-panel {
            flex-grow: 1;
            padding: 20px;
            font-size: 11px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.4);
        }

        .metadata-section {
            margin-bottom: 20px;
        }

        .metadata-label {
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .metadata-value {
            color: var(--neon-cyan);
            display: block;
            margin-bottom: 10px;
        }

        .metadata-pink {
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        /* Main Content Styling */
        #main-container {
            flex-grow: 1;
            position: relative;
        }

        #ui-overlay { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none;
            box-sizing: border-box;
        }

        #top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .toggle-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 8px 15px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        #status-bar { 
            position: absolute; 
            bottom: 20px; left: 20px; 
            font-size: 11px; 
            background: rgba(0, 255, 204, 0.1); 
            padding: 5px 10px; 
            border-left: 3px solid var(--neon-cyan);
            pointer-events: none;
        }

        #controls-hint { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            color: #444; 
            font-size: 10px; 
            pointer-events: none;
        }

        /* Scanline effect */
        #ui-overlay::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(0, 255, 204, 0.05);
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        canvas { display: block; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-header">
            <h1>By-Research</h1>
            <div style="font-size: 9px; color: #666; margin-top: 5px;">ARCHITECTURAL_INTELLIGENCE_v1.0</div>
        </div>
        
        <div id="nav-list">
            <div class="nav-item active" onclick="switchSubject('helsingor')">Helsingør Station</div>
            <div class="nav-item" onclick="switchSubject('ejby')">Ejbybunkeren</div>
            <div class="nav-item" onclick="switchSubject('hadsundvej12l')">Hadsundvej 12L</div>
        </div>

        <div id="metadata-panel">
            <div id="metadata-content">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <div id="main-container">
        <div id="ui-overlay">
            <div id="top-bar">
                <button id="xray-toggle" class="toggle-btn" onclick="toggleXray()">X-Ray Mode: OFF</button>
            </div>

            <div id="status-bar">
                SYSTEM_READY // SOURCE: <span id="source-id">HELSINGØR_STATION</span> // INTEGRITY: 99.8%
            </div>

            <div id="controls-hint">ROT: L_MOUSE | ZOOM: SCROLL | PAN: R_MOUSE</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let helsingorGroup, ejbyGroup, hadsundvejGroup;
        let xrayEnabled = false;
        let currentSubject = 'helsingor';

        const subjects = {
            helsingor: {
                id: 'HELSINGØR_STATION',
                title: 'Stationspladsen 3',
                metadata: {
                    by: 'Helsingør',
                    cvr: 'DATA_UNAVAILABLE',
                    aarstal: '1891',
                    arkitekt: 'Holsøe & Wenck',
                    stilart: 'Nederlandsk Renæssance',
                    dybde: '-6.0m',
                    fundament: '1.600 træpæle',
                    tracks: '5 (Lineart Active)',
                    status: 'Fredet (1990)',
                    special: 'KONGELIG_VENTESAL_DETECTED'
                }
            },
            ejby: {
                id: 'EJBYBUNKEREN',
                title: 'Vestvolden Rødovre',
                metadata: {
                    by: 'København',
                    cvr: 'DATA_UNAVAILABLE',
                    type: 'Kommandobunker',
                    periode: '1952-1954',
                    dybde: '-12.0m',
                    materiale: 'Armeret Beton',
                    air_filtration: 'GAS-SAFE / HEPA',
                    status: 'Museum / Kold Krig',
                    special: 'RADIATION_SHIELDING_ACTIVE'
                }
            },
            hadsundvej12l: {
                id: 'HADSUNDVEJ_12L',
                title: 'Hadsundvej 12L (V6)',
                metadata: {
                    by: 'Rødovre',
                    omraade: 'Islevdal',
                    tenant: 'Flytte Møller',
                    fire_class: 'EI60',
                    fire_load: 'High (Furniture Storage)',
                    miljoestatus: 'Vidensniveau 2 (V2)',
                    bygningsareal: '3.427 m²',
                    special: 'FIRE_SAFETY_LAYER_ACTIVE'
                }
            }
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 300) / window.innerHeight, 0.1, 1000);
            camera.position.set(20, 15, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth - 300, window.innerHeight);
            document.getElementById('main-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights (minimal for lineart)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // Grid
            const grid = new THREE.GridHelper(50, 50, 0x111111, 0x222222);
            scene.add(grid);

            // Build Models
            helsingorGroup = createHelsingorModel();
            ejbyGroup = createEjbyModel();
            hadsundvejGroup = createHadsundvejModel();

            scene.add(helsingorGroup);
            
            ejbyGroup.visible = false;
            scene.add(ejbyGroup);

            hadsundvejGroup.visible = false;
            scene.add(hadsundvejGroup);

            updateUI();

            window.addEventListener('resize', onWindowResize, false);
        }

        function createHelsingorModel() {
            // ... (keeping existing helsingor code)
            const group = new THREE.Group();
            const cyanMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.8 });
            const pinkMat = new THREE.LineBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.2 });
            const platformMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.4 });

            // Main Building
            const mainGeom = new THREE.BoxGeometry(10, 5, 16);
            const mainEdges = new THREE.EdgesGeometry(mainGeom);
            const mainLine = new THREE.LineSegments(mainEdges, cyanMat);
            group.add(mainLine);

            // Office Wing (Administrative Floor)
            const officeGeom = new THREE.BoxGeometry(8, 2, 12);
            const officeEdges = new THREE.EdgesGeometry(officeGeom);
            const officeLine = new THREE.LineSegments(officeEdges, cyanMat);
            officeLine.position.set(0, 3.5, 0);
            group.add(officeLine);

            // Gables (Svungne Renæssancegavle)
            const createGable = (zPos) => {
                const points = [];
                for (let x = -5; x <= 5; x += 0.5) {
                    const y = 2.5 + Math.cos(x * 0.6) * 2 + (5 - Math.abs(x)) * 0.2;
                    points.push(new THREE.Vector3(x, y, zPos));
                }
                const gableGeom = new THREE.BufferGeometry().setFromPoints(points);
                const gableLine = new THREE.Line(gableGeom, cyanMat);
                group.add(gableLine);
                
                // Vertical lines for detail
                for (let x = -4; x <= 4; x += 2) {
                    const y = 2.5 + Math.cos(x * 0.6) * 2 + (5 - Math.abs(x)) * 0.2;
                    const vLineGeom = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(x, 2.5, zPos),
                        new THREE.Vector3(x, y, zPos)
                    ]);
                    group.add(new THREE.LineSegments(vLineGeom, cyanMat));
                }
            };
            createGable(8);
            createGable(-8);

            // Towers
            const towerGeom = new THREE.BoxGeometry(2.5, 8, 2.5);
            const towerEdges = new THREE.EdgesGeometry(towerGeom);
            const towerPos = [[-3.75, 1.5, -6.75], [3.75, 1.5, -6.75], [-3.75, 1.5, 6.75], [3.75, 1.5, 6.75]];
            towerPos.forEach(p => {
                const tower = new THREE.LineSegments(towerEdges, cyanMat);
                tower.position.set(...p);
                group.add(tower);

                // Detailed Copper Spires
                const baseGeom = new THREE.CylinderGeometry(1.2, 1.5, 1, 4);
                const baseEdges = new THREE.EdgesGeometry(baseGeom);
                const base = new THREE.LineSegments(baseEdges, cyanMat);
                base.position.set(p[0], 6, p[2]);
                base.rotation.y = Math.PI / 4;
                group.add(base);

                const spireGeom = new THREE.ConeGeometry(1.2, 4, 4);
                const spireEdges = new THREE.EdgesGeometry(spireGeom);
                const spire = new THREE.LineSegments(spireEdges, cyanMat);
                spire.position.set(p[0], 8.5, p[2]);
                spire.rotation.y = Math.PI / 4;
                group.add(spire);

                // Small tip
                const tipGeom = new THREE.CylinderGeometry(0.1, 0.1, 1, 8);
                const tip = new THREE.LineSegments(new THREE.EdgesGeometry(tipGeom), cyanMat);
                tip.position.set(p[0], 10.5, p[2]);
                group.add(tip);
            });

            // Platform Roofs (Perrontage) - 3 Platforms
            const platGeom = new THREE.BoxGeometry(6, 0.2, 30);
            const platEdges = new THREE.EdgesGeometry(platGeom);
            [-11, -17, -23].forEach(x => {
                const platform = new THREE.LineSegments(platEdges, platformMat);
                platform.position.set(x, 1, 0);
                group.add(platform);

                // Platform pillars
                for (let z = -14; z <= 14; z += 4) {
                    const pillarGeom = new THREE.CylinderGeometry(0.1, 0.1, 3.5, 8);
                    const pillar = new THREE.LineSegments(new THREE.EdgesGeometry(pillarGeom), platformMat);
                    pillar.position.set(x, -0.75, z);
                    group.add(pillar);
                }
            });

            // Tracks (5 Tracks) - Lineart
            const trackPoints = [new THREE.Vector3(0, 0, -15), new THREE.Vector3(0, 0, 15)];
            const trackGeom = new THREE.BufferGeometry().setFromPoints(trackPoints);
            const trackMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.15 });
            [-8, -14, -20, -26, -32].forEach(x => {
                const track = new THREE.Line(trackGeom, trackMat);
                track.position.set(x, -2.5, 0);
                group.add(track);
            });

            // X-Ray Elements (Pink/Cyan Interior)
            const xrayGroup = new THREE.Group();
            xrayGroup.name = "xray";

            // Main Hall Interior (Ankomsthal)
            const hallGeom = new THREE.BoxGeometry(9, 4.5, 14);
            const hall = new THREE.LineSegments(new THREE.EdgesGeometry(hallGeom), pinkMat);
            hall.position.set(0, 0, 0);
            xrayGroup.add(hall);

            // Hall Columns
            const colGeom = new THREE.CylinderGeometry(0.1, 0.1, 4.5, 8);
            for (let x = -2; x <= 2; x += 4) {
                for (let z = -6; z <= 6; z += 3) {
                    const col = new THREE.LineSegments(new THREE.EdgesGeometry(colGeom), pinkMat);
                    col.position.set(x, 0, z);
                    xrayGroup.add(col);
                }
            }

            // Service Nodes (Cyan Highlights)
            const serviceGeom = new THREE.BoxGeometry(1.5, 1, 2);
            const serviceMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.9 });
            const service1 = new THREE.LineSegments(new THREE.EdgesGeometry(serviceGeom), serviceMat);
            service1.position.set(-3, -1, 5); // 7-Eleven
            xrayGroup.add(service1);

            const service2 = new THREE.LineSegments(new THREE.EdgesGeometry(serviceGeom), serviceMat);
            service2.position.set(-3, -1, 2); // Ticket Center
            xrayGroup.add(service2);

            // Royal Waiting Room (Detailed)
            const roomGeom = new THREE.BoxGeometry(3, 2.5, 4);
            const roomEdges = new THREE.EdgesGeometry(roomGeom);
            const room = new THREE.LineSegments(roomEdges, new THREE.LineBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.8 }));
            room.position.set(2.5, -0.5, 4);
            xrayGroup.add(room);

            // Internal walls
            const wallGeom = new THREE.PlaneGeometry(3, 2.5);
            const wall1 = new THREE.LineSegments(new THREE.EdgesGeometry(wallGeom), new THREE.LineBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.4 }));
            wall1.position.set(2.5, -0.5, 3);
            xrayGroup.add(wall1);

            // Foundation Piles (Following footprint)
            const pileGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -8, 0)]);
            
            // Main building piles
            for (let x = -4.5; x <= 4.5; x += 1.2) {
                for (let z = -7.5; z <= 7.5; z += 1.2) {
                    const pile = new THREE.LineSegments(pileGeom, pinkMat);
                    pile.position.set(x, -2.5, z);
                    xrayGroup.add(pile);
                }
            }
            // Platform area piles
            for (let x = -17; x <= -7; x += 2) {
                for (let z = -14; z <= 14; z += 4) {
                    const pile = new THREE.LineSegments(pileGeom, pinkMat);
                    pile.position.set(x, -2.5, z);
                    xrayGroup.add(pile);
                }
            }
            
            group.add(xrayGroup);
            return group;
        }

        function createEjbyModel() {
            // ... (keeping existing ejby code)
            const group = new THREE.Group();
            const cyanMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.8 });
            const pinkMat = new THREE.LineBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.2 });
            const voldMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.15 });

            // Surface (Vestvold Profile - Rampart and Moat)
            const createVoldProfile = (zPos) => {
                const points = [
                    new THREE.Vector3(-20, 0, zPos),
                    new THREE.Vector3(-15, 0, zPos),
                    new THREE.Vector3(-10, 5, zPos), // Rampart top
                    new THREE.Vector3(-5, 5, zPos),
                    new THREE.Vector3(0, 0, zPos),   // Moat start
                    new THREE.Vector3(5, -2, zPos),  // Moat bottom
                    new THREE.Vector3(10, 0, zPos),
                    new THREE.Vector3(20, 0, zPos)
                ];
                const geom = new THREE.BufferGeometry().setFromPoints(points);
                group.add(new THREE.Line(geom, voldMat));
            };
            for (let z = -15; z <= 15; z += 5) createVoldProfile(z);
            
            // Connecting lines for the vold
            const voldLongPoints = [
                [-10, 5], [-5, 5], [5, -2]
            ];
            voldLongPoints.forEach(p => {
                const geom = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(p[0], p[1], -15),
                    new THREE.Vector3(p[0], p[1], 15)
                ]);
                group.add(new THREE.Line(geom, voldMat));
            });

            // Communication Towers & Radio Link
            const towerGeom = new THREE.BoxGeometry(0.5, 12, 0.5);
            const towerEdges = new THREE.EdgesGeometry(towerGeom);
            const towerPos = [[-8, 6, -10], [8, 6, -10], [0, 8, 12]];
            towerPos.forEach(p => {
                const tower = new THREE.LineSegments(towerEdges, cyanMat);
                tower.position.set(...p);
                group.add(tower);
            });

            // External Radio Link (70m Mast Base)
            const mastBaseGeom = new THREE.CylinderGeometry(1.5, 2, 2, 4);
            const mastBase = new THREE.LineSegments(new THREE.EdgesGeometry(mastBaseGeom), cyanMat);
            mastBase.position.set(-12, 6, 0);
            mastBase.rotation.y = Math.PI / 4;
            group.add(mastBase);

            const mastStructureGeom = new THREE.BoxGeometry(1, 8, 1);
            const mastStructure = new THREE.LineSegments(new THREE.EdgesGeometry(mastStructureGeom), cyanMat);
            mastStructure.position.set(-12, 11, 0);
            group.add(mastStructure);

            // X-Ray Elements (Bunker Infrastructure)
            const xrayGroup = new THREE.Group();
            xrayGroup.name = "xray";
            const bunkerMat = new THREE.LineBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.7 });

            // Labyrinthic Corridors (Perimeter System)
            const corridorPoints = [
                new THREE.Vector3(-10, -5, -8), new THREE.Vector3(10, -5, -8),
                new THREE.Vector3(10, -5, -8), new THREE.Vector3(10, -5, 8),
                new THREE.Vector3(10, -5, 8), new THREE.Vector3(-10, -5, 8),
                new THREE.Vector3(-10, -5, 8), new THREE.Vector3(-10, -5, -8)
            ];
            const corridorGeom = new THREE.BufferGeometry().setFromPoints(corridorPoints);
            const corridor = new THREE.Line(corridorGeom, bunkerMat);
            xrayGroup.add(corridor);

            // Operations Room (Double Height)
            const opsGeom = new THREE.BoxGeometry(8, 6, 8);
            const opsEdges = new THREE.EdgesGeometry(opsGeom);
            const opsRoom = new THREE.LineSegments(opsEdges, bunkerMat);
            opsRoom.position.set(0, -5, 0);
            xrayGroup.add(opsRoom);

            // Communication Node (Telefonrum)
            const commsGeom = new THREE.BoxGeometry(4, 3, 4);
            const commsRoom = new THREE.LineSegments(new THREE.EdgesGeometry(commsGeom), bunkerMat);
            commsRoom.position.set(6, -7.5, 4);
            xrayGroup.add(commsRoom);

            // Gallery inside Operations Room
            const galleryGeom = new THREE.BoxGeometry(7.8, 0.1, 7.8);
            const gallery = new THREE.LineSegments(new THREE.EdgesGeometry(galleryGeom), bunkerMat);
            gallery.position.set(0, -3.5, 0);
            xrayGroup.add(gallery);

            // Engine Room (Diesel Generators & Filtration)
            const engineGeom = new THREE.BoxGeometry(4, 3, 5);
            const engineEdges = new THREE.EdgesGeometry(engineGeom);
            const engineRoom = new THREE.LineSegments(engineEdges, bunkerMat);
            engineRoom.position.set(-8, -7.5, -5);
            xrayGroup.add(engineRoom);
            
            // Diesel Generator Assembly
            for (let z = -6.5; z <= -3.5; z += 1.5) {
                const genGeom = new THREE.BoxGeometry(1.2, 0.8, 0.8);
                const gen = new THREE.LineSegments(new THREE.EdgesGeometry(genGeom), bunkerMat);
                gen.position.set(-8.5, -8, z);
                xrayGroup.add(gen);
            }

            // Technical Bay: Air Filtration Units (Gas-Safe)
            for (let z = -7; z <= -3; z += 2) {
                const filterGeom = new THREE.CylinderGeometry(0.4, 0.4, 2, 6);
                const filter = new THREE.LineSegments(new THREE.EdgesGeometry(filterGeom), bunkerMat);
                filter.position.set(-6.5, -7.5, z);
                xrayGroup.add(filter);
            }

            // Entry Tunnel & Security Sluice
            const tunnelGeom = new THREE.BoxGeometry(15, 2, 2);
            const tunnelEdges = new THREE.EdgesGeometry(tunnelGeom);
            const tunnel = new THREE.LineSegments(tunnelEdges, bunkerMat);
            tunnel.position.set(-15, -3.5, 5);
            tunnel.rotation.y = -0.3;
            xrayGroup.add(tunnel);

            // Security Sluice (Billetsluse) with reinforced frames
            const sluiceGeom = new THREE.BoxGeometry(3, 2.5, 3);
            const sluice = new THREE.LineSegments(new THREE.EdgesGeometry(sluiceGeom), bunkerMat);
            sluice.position.set(-10, -3.5, 3.5);
            sluice.rotation.y = -0.3;
            xrayGroup.add(sluice);

            // Ventilation Shafts
            const ventPos = [[4, 0, 4], [-4, 0, -4], [6, 0, -8]];
            ventPos.forEach(p => {
                const vGeom = new THREE.BoxGeometry(0.8, 10, 0.8);
                const vent = new THREE.LineSegments(new THREE.EdgesGeometry(vGeom), bunkerMat);
                vent.position.set(p[0], -5, p[2]);
                xrayGroup.add(vent);
            });

            // General Levels
            const l2Geom = new THREE.BoxGeometry(18, 3, 22);
            const level2 = new THREE.LineSegments(new THREE.EdgesGeometry(l2Geom), bunkerMat);
            level2.position.y = -8.5;
            xrayGroup.add(level2);

            group.add(xrayGroup);
            return group;
        }

        function createHadsundvejModel() {
            const group = new THREE.Group();
            const cyanMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.8 });
            const pinkMat = new THREE.LineBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.3 });
            const yellowMat = new THREE.LineBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.6 });
            const fireMat = new THREE.LineBasicMaterial({ color: 0xff3366, transparent: true, opacity: 0.9 });
            const routeMat = new THREE.LineDashedMaterial({ color: 0x00ffff, dashSize: 0.5, gapSize: 0.2, transparent: true, opacity: 0.4 });

            // Main Hall (20x5x15)
            const mainGeom = new THREE.BoxGeometry(20, 5, 15);
            const mainLine = new THREE.LineSegments(new THREE.EdgesGeometry(mainGeom), cyanMat);
            group.add(mainLine);

            // Loading Zone near mechanical gates
            const loadingGeom = new THREE.PlaneGeometry(6, 4);
            const loadingLine = new THREE.LineSegments(new THREE.EdgesGeometry(loadingGeom), yellowMat);
            loadingLine.rotation.x = -Math.PI / 2;
            loadingLine.position.set(-7, -2.45, 0);
            group.add(loadingLine);

            // High-Load Storage Areas (Flytte Møller)
            const storageGeom = new THREE.BoxGeometry(8, 3.5, 6);
            const storageLine = new THREE.LineSegments(new THREE.EdgesGeometry(storageGeom), cyanMat);
            storageLine.position.set(4, -0.75, -3);
            group.add(storageLine);

            // Pallet Routes (Lineart on floor)
            const routePoints = [
                new THREE.Vector3(-7, -2.45, 0), new THREE.Vector3(5, -2.45, 0),
                new THREE.Vector3(5, -2.45, 0), new THREE.Vector3(5, -2.45, -4),
                new THREE.Vector3(5, -2.45, 0), new THREE.Vector3(5, -2.45, 4)
            ];
            const routeGeom = new THREE.BufferGeometry().setFromPoints(routePoints);
            const route = new THREE.LineSegments(routeGeom, yellowMat);
            group.add(route);

            // Smoke Vents (Røgleme) on roof
            for (let x = -6; x <= 6; x += 4) {
                const ventGeom = new THREE.BoxGeometry(1.2, 0.4, 1.2);
                const vent = new THREE.LineSegments(new THREE.EdgesGeometry(ventGeom), cyanMat);
                vent.position.set(x, 2.7, 0);
                group.add(vent);
            }

            // X-Ray Elements (Internal/Safety)
            const xrayGroup = new THREE.Group();
            xrayGroup.name = "xray";

            // Fire Compartments (EI60 Walls) - Dashed
            const fireWallGeom = new THREE.PlaneGeometry(15, 5);
            const fireWall = new THREE.LineSegments(new THREE.EdgesGeometry(fireWallGeom), fireMat);
            fireWall.rotation.y = Math.PI / 2;
            fireWall.position.set(-2, 0, 0);
            xrayGroup.add(fireWall);

            // Staff Mezzanine (Indskudt dæk)
            const mezzanineGeom = new THREE.BoxGeometry(6, 2.5, 6);
            const mezzanine = new THREE.LineSegments(new THREE.EdgesGeometry(mezzanineGeom), pinkMat);
            mezzanine.position.set(7, 1.25, 4.5);
            xrayGroup.add(mezzanine);

            // Mezzanine Partition (Kitchenette/Toilet)
            const partGeom = new THREE.BoxGeometry(2, 2.5, 3);
            const partition = new THREE.LineSegments(new THREE.EdgesGeometry(partGeom), pinkMat);
            partition.position.set(8.5, 1.25, 5.5);
            xrayGroup.add(partition);

            // Fire Extinguishers (Points near exits)
            const extPos = [[-9.5, -1.5, 7], [9.5, -1.5, -7], [-5, -1.5, 7]];
            extPos.forEach(p => {
                const extGeom = new THREE.BoxGeometry(0.3, 0.6, 0.3);
                const ext = new THREE.LineSegments(new THREE.EdgesGeometry(extGeom), fireMat);
                ext.position.set(...p);
                xrayGroup.add(ext);
            });

            // Foundation Piles (V2 hazard awareness)
            const pileGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -8, 0)]);
            for (let x = -8; x <= 8; x += 4) {
                for (let z = -6; z <= 6; z += 4) {
                    const pile = new THREE.LineSegments(pileGeom, pinkMat);
                    pile.position.set(x, -2.5, z);
                    xrayGroup.add(pile);
                }
            }

            group.add(xrayGroup);
            return group;
        }

        function updateUI() {
            const data = subjects[currentSubject];
            document.getElementById('source-id').innerText = data.id;
            
            const content = document.getElementById('metadata-content');
            let html = `<div class="metadata-section">
                <span class="metadata-label">SUBJECT_IDENTIFIER</span>
                <span class="metadata-value" style="font-size: 14px; font-weight: bold;">${data.title}</span>
            </div>`;

            for (const [key, value] of Object.entries(data.metadata)) {
                const isSpecial = key === 'special';
                html += `<div class="metadata-section">
                    <span class="metadata-label">${key.toUpperCase()}</span>
                    <span class="metadata-value ${isSpecial ? 'metadata-pink' : ''}">${value}</span>
                </div>`;
            }

            content.innerHTML = html;
        }

        window.switchSubject = function(id) {
            currentSubject = id;
            
            // Update Nav
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
                if (el.innerText.toLowerCase().replace(/\s/g, '').includes(id.toLowerCase())) el.classList.add('active');
            });

            // Update Visibility
            helsingorGroup.visible = (id === 'helsingor');
            ejbyGroup.visible = (id === 'ejby');
            hadsundvejGroup.visible = (id === 'hadsundvej12l');

            // Reset rotation or camera if desired
            camera.position.set(20, 15, 20);
            controls.reset();

            updateUI();
        }

        window.toggleXray = function() {
            xrayEnabled = !xrayEnabled;
            const btn = document.getElementById('xray-toggle');
            btn.innerText = `X-Ray Mode: ${xrayEnabled ? 'ON' : 'OFF'}`;
            btn.classList.toggle('active');

            // Toggle visibility of pink groups
            [helsingorGroup, ejbyGroup, hadsundvejGroup].forEach(group => {
                const xray = group.getObjectByName('xray');
                if (xray) {
                    xray.children.forEach(child => {
                        child.visible = xrayEnabled;
                    });
                }
            });
        }

        function onWindowResize() {
            camera.aspect = (window.innerWidth - 300) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 300, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            if (helsingorGroup.visible) helsingorGroup.rotation.y += 0.001;
            if (ejbyGroup.visible) ejbyGroup.rotation.y += 0.001;
            if (hadsundvejGroup.visible) hadsundvejGroup.rotation.y += 0.001;
            
            renderer.render(scene, camera);
        }

        // Initialize X-Ray state (start with OFF)
        [helsingorGroup, ejbyGroup, hadsundvejGroup].forEach(group => {
            const xray = group.getObjectByName('xray');
            if (xray) xray.children.forEach(c => c.visible = false);
        });

    </script>
</body>
</html>
